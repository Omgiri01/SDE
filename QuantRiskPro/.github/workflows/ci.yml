name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests ──────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install fastapi==0.111.0 "uvicorn[standard]==0.29.0" scipy==1.13.0 prometheus-client==0.20.0 httpx==0.27.0

      - name: Run risk engine tests
        run: python -m risk.test_metrics

      - name: Run portfolio engine tests
        run: python -m portfolio.test_portfolio

      - name: Verify API imports
        run: python -c "from api.main import app; print('API import OK')"

  # ── Frontend type-check + build ───────────────────────────────
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Docker build check ────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t quantriskpro-api:${{ github.sha }} .

      - name: Build ingestion image
        run: docker build -f Dockerfile.ingestion -t quantriskpro-ingestion:${{ github.sha }} .

      - name: Build risk image
        run: docker build -f Dockerfile.risk -t quantriskpro-risk:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t quantriskpro-frontend:${{ github.sha }} .
