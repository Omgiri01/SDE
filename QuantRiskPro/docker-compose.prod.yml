version: "3.9"

# Production compose — runs on AWS EC2 t3.medium
# All Python services containerised; Nginx as the single public entry point.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── Infrastructure (same as dev) ──────────────────────────────
  zookeeper:
    restart: always

  kafka:
    restart: always
    environment:
      # In prod, advertise the internal Docker hostname (not localhost)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

  timescaledb:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    restart: always

  # ── Python services ───────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    container_name: quantriskpro-ingestion
    restart: always
    env_file: .env.prod
    depends_on:
      kafka:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: quantriskpro-consumer
    restart: always
    env_file: .env.prod
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  risk:
    build:
      context: .
      dockerfile: Dockerfile.risk
    container_name: quantriskpro-risk
    restart: always
    env_file: .env.prod
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: quantriskpro-api
    restart: always
    env_file: .env.prod
    expose:
      - "8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Nginx reverse proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: quantriskpro-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
